/* =========================================================
   Play engine
   ========================================================= */
let cur = null;        // current run
let busy = false;
let ctl = null;
let mode = "act";

function startRun(kind, id, fresh, opts = {}) {
  const s = findSource(kind, id); if (!s) return;
  haltAll(true);
  const key = runKey(kind, id);
  if (fresh || !runs[key]) {
    const opening = kind === "char" ? s.greeting : s.opening;
    runs[key] = {
      key, kind, ref: id, updated: Date.now(), memory: "",
      status: kind === "char" ? null : (s.status || null),
      choices: opening ? (s.choices || []) : [],
      msgs: opening ? [{ who: "narr", text: opening, opening: true }] : []
    };
    saveRuns();
  }
  cur = runs[key];
  $("#play").hidden = false;
  $("#playTitle").textContent = s.title || s.name;
  $("#playKind").textContent = kind === "char" ? "Chat" : kind === "custom" ? "Your title" : "Story";
  $("#input").placeholder = kind === "char" ? "Say something…" : "What do you do?";
  setMode(kind === "char" ? "say" : "act");
  if (opts.audiobook) {
    if (Voice.engine()) { setListen(true); Voice.unlock(); }
    else toast("Voices aren't available in this browser. Auto-play will run as text.");
    if (aiState === "ready") { auto.on = true; auto.left = auto.total = 10; }
    else toast("Open this page in the Claude app so the narrator can keep writing.");
  }
  drawLog(); drawStatus(); drawChoices(); updateComposer(); drawAutobar();
  if (!cur.msgs.length) { cur.msgs.push({ who: "player", mode: "begin", hidden: true, text: "Write the opening scene." }); generate(); }
  else if (opts.audiobook) {
    const last = cur.msgs[cur.msgs.length - 1];
    if (last.who === "narr") afterNarration(cur, cur.msgs.length - 1);
    else if (auto.on) generate();
  }
}

function leavePlay() {
  haltAll(true);
  if (busy && ctl) ctl.abort();
  closeMenu();
  $("#play").hidden = true; cur = null;
  render();
}
$("#playBack").onclick = leavePlay;

function setMode(m) {
  mode = m;
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  const ph = { act: cur?.kind === "char" ? "Describe what you do…" : "What do you do?", say: "What do you say?", direct: "Tell the narrator what should happen (out of character)" };
  $("#input").placeholder = ph[m];
}
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

function playerLabel(m) { return { act: "Act", say: "Say", direct: "Direct" }[m] || ""; }
function speakerFor() {
  const s = findSource(cur.kind, cur.ref);
  if (cur.kind === "char") return { i: s.kanji, n: s.name };
  return { i: "語", n: "Narrator" };
}
function msgHTML(m, idx) {
  if (m.hidden) return "";
  if (m.who === "player") {
    return `<div class="msg player ${m.mode === "direct" ? "direct" : ""}"><span class="m">${m.auto ? "Auto · " : ""}${playerLabel(m.mode)}</span>${esc(m.text)}</div>`;
  }
  const sp = speakerFor();
  const body = m.pending && !m.text ? `<div class="thinking" aria-label="Writing"><span></span><span></span><span></span></div>` : narrHTML(m.text, cur);
  const canPlay = !m.pending && m.text && Voice.engine();
  const on = reading && reading.run === cur && reading.mi === idx;
  return `<div class="msg narr" data-i="${idx}"><div class="speaker"><i>${esc(sp.i)}</i>${esc(sp.n)}${canPlay ? `<button class="replay ${on ? "on" : ""}" data-play="${idx}" aria-label="${on ? "Stop reading" : "Read aloud"}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M4 9v6h4l5 4V5L8 9z"/></svg></button>` : ""}</div><div class="body">${body}</div>${m.error ? `<div class="err" style="margin-top:10px">${esc(m.error)}</div>` : ""}</div>`;
}
$("#log").addEventListener("click", e => {
  const b = e.target.closest("[data-play]"); if (!b || !cur) return;
  const mi = Number(b.dataset.play);
  if (reading && reading.run === cur && reading.mi === mi) { haltVoice(); return; }
  if (auto.timer) { clearInterval(auto.timer); auto.timer = null; }
  Voice.unlock();
  narrate(cur, mi);
});
function drawLog() {
  const log = $("#log");
  log.innerHTML = cur.msgs.map(msgHTML).join("") + (cur.lastError ? `<div class="err">${esc(cur.lastError)}</div>` : "") +
    (aiState === "missing" ? `<div class="notice warn" style="margin-top:0"><span class="dot"></span><div><strong>Open this in the Claude app to play.</strong> You can read the opening here, but the narrator only writes when the page runs inside Claude.</div></div>` : "");
  log.scrollTop = cur.msgs.filter(m => !m.hidden).length <= 1 ? 0 : log.scrollHeight;
}
function drawStatus() {
  const box = $("#statusBox");
  if (!cur.status) { box.hidden = true; return; }
  box.hidden = false;
  const parts = cur.status.split("|").map(p => p.trim()).filter(Boolean).map(p => { const i = p.indexOf(":"); return i > 0 ? [p.slice(0, i).trim(), p.slice(i + 1).trim()] : [p, ""]; });
  $("#statusStats").innerHTML = parts.map(([k, v]) => `<div><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("");
}
$("#statusBox").addEventListener("toggle", e => { $("#statusToggle").textContent = e.target.open ? "▾" : "▸"; });
function drawChoices() {
  const el = $("#choices");
  const list = busy ? [] : (cur.choices || []);
  el.innerHTML = list.map(c => `<button>${esc(c)}</button>`).join("");
  el.hidden = !list.length;
  el.querySelectorAll("button").forEach((b, i) => b.onclick = () => {
    haltAll();
    const turn = choiceToTurn(list[i], cur.kind);
    submit(turn.text, turn.mode);
  });
}
function updateComposer() {
  if (!cur) return;
  const send = $("#sendBtn");
  const canAI = aiState === "ready";
  send.classList.toggle("stop", busy);
  send.setAttribute("aria-label", busy ? "Stop" : "Send");
  send.innerHTML = busy ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>` : `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>`;
  send.disabled = !busy && !canAI;
  const last = cur.msgs[cur.msgs.length - 1];
  $("#btnContinue").disabled = busy || !canAI;
  $("#btnRetry").disabled = busy || !canAI || !last || (last.who === "narr" && last.opening);
  const ab = $("#btnAuto");
  ab.classList.toggle("on", auto.on); ab.setAttribute("aria-pressed", auto.on);
  ab.disabled = !auto.on && !canAI;
  $("#listenBtn").classList.toggle("on", listenOn); $("#listenBtn").setAttribute("aria-pressed", listenOn);
}

/* ---------- prompt building ---------- */
const WORDS = { story: { short: 90, medium: 160, long: 260 }, char: { short: 45, medium: 85, long: 150 } };
function rulesFor(run) {
  const s = findSource(run.kind, run.ref);
  const name = profile.name || "Yuki";
  const about = profile.about ? `\nABOUT THE PLAYER (from their profile): ${profile.about}` : "";
  const memory = run.memory ? `\nPINNED MEMORY (facts the player wants you to always respect): ${run.memory}` : "";
  const tags = `Player turns are tagged: [Act] = what the player does. [Say] = words the player says aloud. [Direct] = an out-of-character note to you about where the story should go; follow it but never mention it in the story. [Continue] = keep the scene moving with no new input from the player. [Begin] = write the opening.`;
  if (run.kind === "char") {
    const n = WORDS.char[profile.length] || 85;
    return `You are roleplaying as ${s.name} (${s.title}) in a one-on-one interactive chat with the player, whose name is ${name}.
PERSONA: ${s.persona}
SETTING: ${s.setting}${about}${memory}

${tags}

STYLE: Stay fully in character. Mix short actions in *asterisks* with spoken dialogue in double quotes. Remember what has happened earlier in the chat and refer back to it. Have your own moods and opinions, ask questions, react to the player. Never write the player's words, thoughts or actions for them. About ${n} words. Keep it PG-13: no explicit sexual content, no graphic gore.

FORMAT: Write your in-character reply first. Then on a new line write @@CHOICES followed by exactly three short things ${name} could say or do next (under 10 words each), one per line, each starting with "- ". Put spoken suggestions in double quotes. Then on a new line write @@BEST followed by only the number (1, 2 or 3) of the option that would make the most interesting conversation. Write nothing after that.

OPENING LINE ALREADY SHOWN TO THE PLAYER:
${s.greeting}`;
  }
  const n = WORDS.story[profile.length] || 160;
  const cast = (s.cast || []).map(([cn, cd]) => `- ${cn}${cd ? ": " + cd : ""}`).join("\n") || "- Invent characters as needed.";
  const exName = ((s.cast || [])[0] || ["Aiko"])[0];
  const statusRule = run.status ? `\nThen on a new line write @@STATUS followed by ONE line of the player's updated stats in the exact form "Key: value | Key: value". Keep the same keys in the same order unless the story clearly adds one. Change values only when the story justifies it. Current stats: ${run.status}` : "";
  const opening = s.opening ? `\n\nOPENING SCENE ALREADY SHOWN TO THE PLAYER:\n${s.opening}` : "";
  return `You are the narrator and game master of an interactive anime story. The player controls the main character; you control the world and everyone else in it.

STORY: ${s.title} (${(s.genres || []).join(", ")})
PREMISE: ${s.synopsis}
WORLD AND TONE: ${s.world || "Match the premise."}
CAST:
${cast}
THE PLAYER: ${s.role} If the role gives no name, the player is called ${name}.${about}${memory}

${tags}

STYLE: Second person ("you"), present tense, like a light novel or anime episode. Vivid, specific, quick to read on a phone; short paragraphs. Side characters have distinct voices and their own goals, and they act on their own. Show real consequences of the player's choices and keep track of what happened before. Escalate gradually and plant hooks. Never decide the player's words, feelings or major actions for them. End each reply on a moment that invites the player's next move. About ${n} words. Keep it PG-13: no explicit sexual content, no graphic gore.

VOICES: The story is also read aloud with a different voice per character. Tag every line of spoken dialogue with the speaker's name in curly braces directly before the opening quote, for example {${exName}}"We have to go." Use names exactly as in the cast list (give new characters a short name and keep it), and tag the player's own spoken lines as {You}. The tags are hidden from the reader. If the story has a system, status screen or magical interface, its messages go in their own paragraph starting with [SYSTEM].

FORMAT: Write only the story text first. Then on a new line write @@CHOICES followed by exactly three short, different next moves for the player (under 10 words each), one per line, each starting with "- ". Put spoken suggestions in double quotes. Then on a new line write @@BEST followed by only the number (1, 2 or 3) of the move that would lead to the most exciting, in-character next scene.${statusRule}
Write nothing else after that.${opening}`;
}
function buildTurns(run) {
  const turns = [{ role: "user", content: rulesFor(run) }];
  let msgs = run.msgs.filter(m => !m.opening && !m.pending && !(m.who === "narr" && m.error && !m.text));
  if (msgs.length > 40) msgs = msgs.slice(-40);
  while (msgs.length && msgs[0].who === "narr") msgs.shift();
  for (const m of msgs) {
    if (m.who === "player") {
      const tag = { act: "Act", say: "Say", direct: "Direct", continue: "Continue", begin: "Begin" }[m.mode] || "Act";
      turns.push({ role: "user", content: `[${tag}] ${m.text}` });
    } else if (m.text) {
      turns.push({ role: "assistant", content: m.text });
    }
  }
  return turns;
}
function parseReply(t) {
  const idx = t.indexOf("@@");
  const story = (idx >= 0 ? t.slice(0, idx) : t).replace(/@+$/, "").trim();
  let choices = [], status = null;
  const cm = t.match(/@@CHOICES\s*([\s\S]*?)(?=@@|$)/);
  if (cm) choices = cm[1].split("\n").map(l => l.trim()).filter(l => /^[-*•\d]/.test(l)).map(l => l.replace(/^([-*•]|\d+[.)])\s*/, "").trim()).filter(Boolean).slice(0, 3);
  const sm = t.match(/@@STATUS\s*([^\n]+)/);
  if (sm) status = sm[1].trim();
  const bm = t.match(/@@BEST\s*(\d)/);
  const best = bm ? clamp(Number(bm[1]), 1, 3) : 1;
  return { story, choices, status, best };
}
// A suggested move becomes a turn: a quoted line is speech, anything else is an action.
function choiceToTurn(c, kind) {
  const t = String(c || "").trim();
  const q = t.match(/^["“]([^"”]+)["”]/);
  if (q) return { mode: "say", text: q[1].replace(/[,.]$/, "").trim() + (/[!?]$/.test(q[1]) ? "" : ".") };
  return { mode: kind === "char" ? "say" : "act", text: t };
}

/* ---------- turn flow ---------- */
function submit(text, m) {
  if (busy || !cur) return;
  text = (text || "").trim(); if (!text) return;
  if (aiState !== "ready") { toast("Open this page in the Claude app to play"); return; }
  cur.msgs.push({ who: "player", mode: m || mode, text });
  cur.lastError = null;
  generate();
}
async function generate() {
  if (!cur) return;
  if (aiState !== "ready" || !sample) { drawLog(); updateComposer(); return; }
  const run = cur;
  haltVoice();
  busy = true; run.choices = [];
  let ok = false;
  const msg = { who: "narr", text: "", pending: true };
  run.msgs.push(msg);
  drawLog(); drawChoices(); updateComposer(); drawAutobar();
  const bodyEl = () => document.querySelector(`#log .msg.narr[data-i="${run.msgs.indexOf(msg)}"] .body`);
  ctl = new AbortController();
  const log = $("#log");
  try {
    const turns = buildTurns(run);
    const res = await sample(turns, {
      cache: false, signal: ctl.signal, modelTier: profile.tier === "default" ? "default" : "quick",
      onText: ({ text }) => {
        if (cur !== run) return;
        const p = parseReply(text);
        msg.text = p.story;
        const el = bodyEl(); if (el && p.story) el.innerHTML = narrHTML(p.story, run);
        const nearBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 140;
        if (nearBottom) log.scrollTop = log.scrollHeight;
      }
    });
    const p = parseReply(res.text);
    msg.text = p.story || res.text.trim();
    run.choices = p.choices; run.best = p.best;
    if (p.status && run.status) run.status = p.status;
    if (res.truncated) msg.error = "This reply was cut short. Tap Continue to pick it up.";
    ok = true;
  } catch (e) {
    const code = e && e.code;
    if (code === "cancelled") {
      msg.text = (e.text ? parseReply(e.text).story : msg.text) || "";
      if (!msg.text) run.msgs.splice(run.msgs.indexOf(msg), 1);
    } else if (code === "refused") {
      run.msgs.splice(run.msgs.indexOf(msg), 1);
      run.lastError = errCopy(code);
    } else {
      const partial = e && e.text ? parseReply(e.text).story : "";
      if (partial) { msg.text = partial; msg.error = errCopy(code); }
      else { run.msgs.splice(run.msgs.indexOf(msg), 1); run.lastError = errCopy(code); }
    }
  } finally {
    delete msg.pending;
    busy = false; ctl = null;
    run.updated = Date.now();
    saveRuns();
    if (cur === run) {
      drawLog(); drawStatus(); drawChoices(); updateComposer(); drawAutobar();
      if (ok) afterNarration(run, run.msgs.indexOf(msg));
      else if (auto.on) stopAuto("Auto-play stopped");
    }
  }
}

$("#sendBtn").onclick = () => {
  if (busy) { stopAuto(); ctl?.abort(); return; }
  const ta = $("#input"); const v = ta.value;
  if (!v.trim()) { ta.focus(); return; }
  ta.value = ""; autosize();
  haltAll();
  submit(v, mode);
};
const ta = $("#input");
function autosize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 130) + "px"; }
ta.addEventListener("input", autosize);
ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(hover: hover)").matches) { e.preventDefault(); $("#sendBtn").click(); } });
$("#btnContinue").onclick = () => {
  if (busy || !cur) return;
  haltAll();
  cur.lastError = null;
  cur.msgs.push({ who: "player", mode: "continue", hidden: true, text: "Continue the scene." });
  generate();
};
$("#btnRetry").onclick = () => {
  if (busy || !cur) return;
  haltAll();
  cur.lastError = null;
  const last = cur.msgs[cur.msgs.length - 1];
  if (!last) return;
  if (last.who === "narr") { if (last.opening) return; cur.msgs.pop(); }
  generate();
};

/* ---------- play menu ---------- */
function closeMenu() { $("#playMenu")?.remove(); }
$("#playMenuBtn").onclick = e => {
  e.stopPropagation();
  if ($("#playMenu")) { closeMenu(); return; }
  const m = document.createElement("div");
  m.className = "menu"; m.id = "playMenu";
  m.innerHTML = `<button data-a="voices">Voices and speed</button><button data-a="memory">Pinned memory${cur.memory ? " ✓" : ""}</button><button data-a="info">About this story</button><button data-a="undo">Undo last turn</button><button data-a="restart" class="danger">Start over</button>`;
  $("#play").append(m);
  m.querySelectorAll("button").forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const a = b.dataset.a;
    if (a === "restart") {
      if (b.dataset.armed) { closeMenu(); haltAll(true); if (busy) ctl?.abort(); const { kind, ref } = cur; setTimeout(() => startRun(kind, ref, true), 0); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to erase this run"; }
      return;
    }
    closeMenu();
    if (a === "info") openDetailInfo();
    if (a === "memory") openMemory();
    if (a === "voices") openVoices();
    if (a === "undo") { haltAll(); undoTurn(); }
  });
};
document.addEventListener("click", e => { if ($("#playMenu") && !e.target.closest("#playMenu")) closeMenu(); });
function undoTurn() {
  if (busy || !cur) return;
  let i = cur.msgs.length - 1, removed = 0;
  while (i >= 0 && !cur.msgs[i].opening) {
    const m = cur.msgs[i]; cur.msgs.splice(i, 1); removed++;
    if (m.who === "player" && !m.hidden) break;
    i--;
  }
  if (!removed) { toast("Nothing to undo"); return; }
  const lastN = [...cur.msgs].reverse().find(m => m.who === "narr");
  if (lastN && lastN.opening) { const s = findSource(cur.kind, cur.ref); cur.choices = s.choices || []; } else cur.choices = [];
  cur.lastError = null; saveRuns(); drawLog(); drawChoices(); updateComposer(); toast("Last turn undone");
}
function openDetailInfo() {
  const s = findSource(cur.kind, cur.ref);
  openSheet(`<div class="detail"><div class="detail-top">${coverHTML(s, { noTitle: true })}<div><h2>${esc(s.title || s.name)}</h2></div></div><p>${esc(s.synopsis || s.persona)}</p>${s.role ? `<div class="label">Your role</div><div class="role">${esc(s.role)}</div>` : ""}${(s.cast || []).length ? `<div class="label">Cast</div><div class="cast">${s.cast.map(([n, d]) => `<div><span class="av">${esc(n[0])}</span><div><b>${esc(n)}</b><span>${esc(d)}</span></div></div>`).join("")}</div>` : ""}<div class="actions"><button class="btn ghost" id="closeInfo">Back to story</button></div></div>`,
    sc => sc.querySelector("#closeInfo").onclick = closeSheet);
}
function openMemory() {
  openSheet(`<div class="form"><div class="field"><label for="memText" style="font-size:16px">Pinned memory</label><span class="hint">Facts the narrator should never forget in this story: names, promises, secrets, how a character feels about you.</span><textarea id="memText" style="min-height:140px" placeholder="e.g. Lisette knows about my Archive skill. I promised Mira I'd find her brother.">${esc(cur.memory || "")}</textarea></div><div class="actions"><button class="btn" id="memSave">Save memory</button></div></div>`,
    sc => sc.querySelector("#memSave").onclick = () => { cur.memory = sc.querySelector("#memText").value.trim(); saveRuns(); closeSheet(); toast("Memory pinned"); });
}

/* =========================================================
   Audiobook + auto-play
   ========================================================= */
let listenOn = !!profile.listen;
let reading = null;      // { run, mi, lines, speaker }
let skipFlag = false;
const auto = { on: false, left: 0, total: 0, timer: null, countdown: 0 };

function lastNarrIndex() { if (!cur) return -1; for (let i = cur.msgs.length - 1; i >= 0; i--) if (cur.msgs[i].who === "narr" && cur.msgs[i].text) return i; return -1; }
function setListen(on) {
  listenOn = on; profile.listen = on; saveProfile();
  if (!on) haltVoice();
  if (cur) updateComposer();
}
$("#listenBtn").onclick = () => {
  if (!Voice.engine()) { toast("Voices aren't available in this browser"); return; }
  const on = !listenOn;
  setListen(on);
  if (on) {
    Voice.unlock();
    toast("Read aloud on");
    const mi = lastNarrIndex();
    if (!busy && mi >= 0) narrate(cur, mi);
  } else toast("Read aloud off");
};

function clearHighlight() { document.querySelectorAll("#log .sg.reading").forEach(e => e.classList.remove("reading")); document.querySelectorAll("#log .replay.on").forEach(e => e.classList.remove("on")); }
function highlight(i) {
  if (!reading) return;
  const l = reading.lines[i]; if (!l) return;
  reading.speaker = l.speaker; drawAutobar();
  clearHighlight();
  const box = document.querySelector(`#log .msg.narr[data-i="${reading.mi}"]`);
  box?.querySelector(".replay")?.classList.add("on");
  const el = box?.querySelector(`.sg[data-k="${l.k}"]`);
  if (el) { el.classList.add("reading"); el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}
async function readMsg(run, mi) {
  const msg = run.msgs[mi];
  if (!msg || !msg.text) return "done";
  if (!Voice.engine()) return "error";
  const lines = linesFor(msg.text, run);
  if (!lines.length) return "done";
  reading = { run, mi, lines, speaker: "" }; skipFlag = false;
  drawAutobar();
  const res = await Voice.play(lines, sp => voiceCfg(run, sp), highlight);
  if (reading && reading.run === run && reading.mi === mi) { reading = null; clearHighlight(); }
  saveRuns(); // keeps newly met speakers
  drawAutobar();
  if (res === "stopped") return skipFlag ? "skipped" : "stopped";
  return res;
}
async function narrate(run, mi) {
  const r = await readMsg(run, mi);
  if (cur !== run) return;
  if (r === "error") setListen(false);
  if (auto.on && r !== "stopped") scheduleNext(r !== "error");
}
function afterNarration(run, mi) {
  if (cur !== run || mi < 0) return;
  if (listenOn && Voice.engine()) narrate(run, mi);
  else if (auto.on) scheduleNext(false);
}
function scheduleNext(afterAudio) {
  if (!auto.on || !cur) return;
  if (auto.left <= 0) { stopAuto(`Auto-play finished ${auto.total} turns`); return; }
  const last = cur.msgs[lastNarrIndex()];
  const words = last ? stripTags(last.text).split(/\s+/).length : 0;
  auto.countdown = afterAudio ? 2 : clamp(Math.round(words / 4), 5, 25);
  clearInterval(auto.timer);
  auto.timer = setInterval(() => { auto.countdown--; if (auto.countdown <= 0) autoStep(); else drawAutobar(); }, 1000);
  drawAutobar();
}
function autoStep() {
  clearInterval(auto.timer); auto.timer = null;
  if (!auto.on || !cur || busy) return;
  const ch = cur.choices || [];
  const pick = ch[(cur.best || 1) - 1] || ch[0];
  auto.left--;
  if (pick) {
    const turn = choiceToTurn(pick, cur.kind);
    cur.msgs.push({ who: "player", mode: turn.mode, text: turn.text, auto: true });
  } else cur.msgs.push({ who: "player", mode: "continue", hidden: true, text: "Continue the scene." });
  cur.lastError = null;
  generate();
}
function startAuto(n, withListen) {
  if (!cur) return;
  if (aiState !== "ready") { toast("Open this page in the Claude app to use auto-play"); return; }
  haltVoice();
  auto.on = true; auto.left = auto.total = n;
  if (withListen && Voice.engine()) { setListen(true); Voice.unlock(); }
  else if (!withListen && listenOn) setListen(false);
  updateComposer(); drawAutobar();
  if (busy) return;
  const last = cur.msgs[cur.msgs.length - 1];
  if (!last || last.who !== "narr") { generate(); return; }
  afterNarration(cur, cur.msgs.length - 1);
}
function stopAuto(msg) {
  const was = auto.on;
  auto.on = false; clearInterval(auto.timer); auto.timer = null;
  if (cur) updateComposer();
  drawAutobar();
  if (msg && was) toast(msg);
}
function haltVoice() {
  if (reading || Voice.state !== "idle") { skipFlag = false; Voice.stop(); }
  reading = null; clearHighlight(); drawAutobar();
}
function haltAll(silent) { stopAuto(silent ? null : (auto.on ? "Auto-play off" : null)); haltVoice(); }

function drawAutobar() {
  const bar = $("#autobar"); if (!bar) return;
  const show = !!reading || auto.on;
  bar.hidden = !show; if (!show) return;
  let txt;
  if (reading) txt = (Voice.state === "paused" ? "Paused" : "Reading") + (reading.speaker ? " · " + reading.speaker : "");
  else if (auto.timer) txt = `Next move in ${auto.countdown}s`;
  else if (busy) txt = "Writing the next scene…";
  else txt = "Auto-play on";
  if (auto.on) txt = `Auto ${Math.min(auto.total - auto.left, auto.total)}/${auto.total} · ` + txt;
  $("#abText").textContent = txt;
  $("#abPause").hidden = !reading;
  $("#abPause").textContent = Voice.state === "paused" ? "Resume" : "Pause";
  $("#abSkip").hidden = !(reading || auto.timer);
}
$("#abPause").onclick = () => { Voice.state === "paused" ? Voice.resume() : Voice.pause(); drawAutobar(); };
$("#abSkip").onclick = () => { if (reading) { skipFlag = true; Voice.stop(); } else if (auto.timer) autoStep(); };
$("#abStop").onclick = () => { haltAll(true); toast("Stopped"); };

$("#btnAuto").onclick = () => { if (auto.on) { stopAuto("Auto-play off"); return; } openAutoSheet(); };
function openAutoSheet() {
  const eng = Voice.engine();
  let n = 10;
  openSheet(`<div class="form">
      <div><h2 class="st">Auto-play</h2><p class="sp">The narrator picks the strongest move each turn and keeps the story going on its own. Tap Stop any time to take over.</p></div>
      <div class="field"><span class="lbl">How many turns</span><div class="seg" role="group" aria-label="Turns" id="autoN">${[5, 10, 25].map(v => `<button type="button" data-v="${v}" aria-pressed="${v === n}">${v} turns</button>`).join("")}</div></div>
      <label class="toggle"><input type="checkbox" id="autoListen" ${eng ? "checked" : "disabled"}> Read it aloud with character voices (audiobook)</label>
      ${eng ? "" : `<span class="hint">Voices aren't available in this browser, so auto-play runs as text.</span>`}
      <span class="hint">Each turn uses your Claude usage.</span>
      <div class="actions"><button class="btn" id="autoGo">Start auto-play</button></div>
    </div>`, sc => {
    sc.querySelectorAll("#autoN button").forEach(b => b.onclick = () => { n = Number(b.dataset.v); sc.querySelectorAll("#autoN button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
    sc.querySelector("#autoGo").onclick = () => { const l = sc.querySelector("#autoListen").checked; closeSheet(); startAuto(n, l); };
  });
}

function openVoices() {
  const run = cur; const eng = Voice.engine();
  if (!eng) { toast("Voices aren't available in this browser"); return; }
  const dv = deviceVoices();
  const speeds = [[0.85, "Slow"], [0.93, "Calm"], [1, "Normal"], [1.08, "Quick"], [1.18, "Fast"]];
  const pitches = [[0.7, "Deep"], [0.82, "Low"], [1, "Mid"], [1.2, "High"], [1.4, "Bright"]];
  const near = (arr, v) => arr.reduce((a, b) => Math.abs(b[0] - v) < Math.abs(a[0] - v) ? b : a)[0];
  const row = sp => {
    const c = voiceCfg(run, sp);
    const voiceSel = eng === "claude"
      ? `<select data-f="cv" aria-label="Voice for ${esc(sp)}">${["buttery", "airy", "glassy", "rounded"].map(v => `<option value="${v}" ${c.cv === v ? "selected" : ""}>${v[0].toUpperCase() + v.slice(1)}</option>`).join("")}</select>`
      : `<select data-f="dv" aria-label="Voice for ${esc(sp)}">${dv.map(v => `<option value="${esc(v.voiceURI)}" ${c.dv === v.voiceURI ? "selected" : ""}>${esc(v.name)}</option>`).join("") || `<option value="">Default</option>`}</select>`;
    const pitchSel = eng === "device" ? `<select data-f="pitch" aria-label="Pitch for ${esc(sp)}">${pitches.map(([v, l]) => `<option value="${v}" ${near(pitches, c.pitch) === v ? "selected" : ""}>${l}</option>`).join("")}</select>` : "";
    const speedSel = `<select data-f="rate" aria-label="Speed for ${esc(sp)}">${speeds.map(([v, l]) => `<option value="${v}" ${near(speeds, c.rate) === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    const d = sp === "Narrator" ? "Reads the scene" : sp === "System" ? "Status windows and system messages" : sp === "You" ? "Your own spoken lines" : (descFor(run, sp) || "Met in this story");
    return `<div class="vrow" data-sp="${esc(sp)}"><div style="min-width:0"><b>${esc(sp)}</b><small>${esc(d)}</small></div><button class="btn small ghost" data-prev>Preview</button><div class="vsel">${voiceSel}${pitchSel}${speedSel}</div></div>`;
  };
  openSheet(`<div><h2 class="st">Voices and speed</h2><p class="sp">${eng === "claude" ? "Using Claude voices. There are four, so characters also differ by speed." : "Using your device's voices. Pitch and speed make each character distinct."} Change the engine in MY.</p>
    <div>${speakersFor(run).map(row).join("")}</div>
    <div class="actions"><button class="btn ghost" id="vReset">Reset to defaults</button><button class="btn" id="vDone">Done</button></div></div>`, sc => {
    sc.querySelectorAll(".vrow").forEach(r => {
      const sp = r.dataset.sp;
      r.querySelectorAll("select").forEach(s => s.onchange = () => {
        run.voices = run.voices || {};
        const f = s.dataset.f;
        run.voices[sp] = Object.assign({}, run.voices[sp] || {}, { [f]: f === "rate" || f === "pitch" ? Number(s.value) : s.value });
        saveRuns();
      });
      r.querySelector("[data-prev]").onclick = () => {
        haltAll(true); Voice.unlock();
        const text = sp === "Narrator" ? "The wind shifts, and the story turns with it." : sp === "System" ? "System notice. A new authority has been unlocked." : `This is ${sp}. Remember my voice.`;
        Voice.play([{ k: 0, text, speaker: sp }], s2 => voiceCfg(run, s2), () => {});
      };
    });
    sc.querySelector("#vReset").onclick = () => { run.voices = {}; saveRuns(); closeSheet(); openVoices(); toast("Voices reset"); };
    sc.querySelector("#vDone").onclick = closeSheet;
  });
}

/* ---------- boot ---------- */
setTab("home");
</script>
