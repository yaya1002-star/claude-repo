<title>Yume Tales</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app — scrolling view above a fixed tab bar; play screen takes over the full height like a visual-novel reader. */
:root {
  --bg: #0f0d18;
  --surface: #1a1727;
  --surface-2: #242036;
  --line: #2f2a45;
  --fg: #f3f0fb;
  --muted: #a39dbd;
  --accent: #ff7aa8;       /* sakura: primary actions */
  --accent-ink: #2a0815;
  --system: #7fe0ff;       /* status-window blue */
  --system-bg: rgba(52, 140, 200, .14);
  --danger: #ff6b6b;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--bg); }
.view { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 24px; }
.pad { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 18px; padding-block: 14px 8px; position: sticky; top: 0; background: linear-gradient(var(--bg) 70%, transparent); z-index: 5; }
.modeswitch { display: flex; gap: 16px; flex: 1; }
.modeswitch button { font-family: var(--display); font-size: 24px; color: var(--muted); opacity: .55; letter-spacing: .01em; }
.modeswitch button[aria-pressed="true"] { color: var(--fg); opacity: 1; }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: var(--fg); }
.iconbtn:hover { background: var(--surface); }

/* ---------- hero banner ---------- */
.hero { margin-top: 6px; border-radius: 20px; overflow: hidden; position: relative; padding: 20px; min-height: 168px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px;
  background: radial-gradient(120% 90% at 85% 10%, #ff7aa855, transparent 60%), radial-gradient(80% 80% at 0% 100%, #7fe0ff33, transparent 60%), var(--surface); border: 1px solid var(--line); }
.hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.14) 1px, transparent 1.5px); background-size: 8px 8px; mask-image: linear-gradient(120deg, transparent 30%, #000 100%); -webkit-mask-image: linear-gradient(120deg, transparent 30%, #000 100%); }
.hero .big { position: absolute; right: -6px; top: -18px; font-family: var(--display); font-size: 120px; line-height: 1; color: #ffffff12; }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: 25px; line-height: 1.15; margin: 0; text-wrap: balance; position: relative; }
.hero p { margin: 0; color: var(--muted); font-size: 14px; position: relative; max-width: 34ch; }
.hero .btn { align-self: flex-start; margin-top: 8px; position: relative; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.small { height: 34px; padding: 0 14px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- chips ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 16px 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #ff7aa814; }

.notice { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.notice strong { color: var(--fg); font-weight: 700; }
.notice .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--system); margin-top: 6px; flex: none; }
.notice.warn .dot { background: #ffc857; }

/* ---------- sections & rails ---------- */
.section { margin-top: 26px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sechead h3 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .01em; }
.sechead .sub { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
.rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; padding-left: var(--gutter-l); padding-right: var(--gutter-r); scroll-padding-left: var(--gutter-l); }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: none; }
.card { width: 148px; text-align: left; display: flex; flex-direction: column; gap: 7px; }
.card.lg { width: 178px; }
.card.sm { width: 104px; }
.card .ttl { font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; }
.grid .card { width: auto; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* ---------- procedural covers ---------- */
.cover { position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 100%; border-radius: 14px; overflow: hidden; container-type: inline-size; isolation: isolate;
  background: radial-gradient(90% 70% at 78% 18%, var(--c2), transparent 62%), linear-gradient(165deg, var(--c1) 0%, #0c0a14 88%); box-shadow: 0 1px 0 #ffffff14 inset; }
.cover::before { content: ""; position: absolute; inset: 0; z-index: -1; background: repeating-conic-gradient(from 0deg at 82% 14%, #ffffff0d 0deg 3deg, transparent 3deg 9deg); }
.cover::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.22) 1px, transparent 1.4px); background-size: 6px 6px; mask-image: linear-gradient(200deg, #000 0%, transparent 45%); -webkit-mask-image: linear-gradient(200deg, #000 0%, transparent 45%); pointer-events: none; }
.cover .kj { position: absolute; right: -9cqw; top: 3cqw; font-family: var(--display); font-size: 84cqw; line-height: 1; color: #fff; opacity: .92; text-shadow: 0 0 8cqw var(--c2), 2cqw 2cqw 0 #00000055; transform: rotate(-6deg); }
.cover .shade { position: absolute; inset: 40% 0 0; background: linear-gradient(transparent, #07060ccc 55%, #07060c); }
.cover .ct { position: absolute; left: 7cqw; right: 7cqw; bottom: 7cqw; font-family: var(--display); font-size: 10.5cqw; line-height: 1.12; color: #fff; text-wrap: balance; text-shadow: 0 2px 0 #0008; }
.cover .rank { position: absolute; left: 6cqw; top: 6cqw; min-width: 17cqw; height: 17cqw; padding: 0 4cqw; border-radius: 4cqw; display: grid; place-items: center; background: #0009; font-family: var(--display); font-size: 10cqw; color: #fff; backdrop-filter: blur(4px); }
.cover .tag { position: absolute; right: 6cqw; top: 6cqw; padding: 1.5cqw 4cqw; border-radius: 99px; background: var(--system); color: #00222e; font-size: 7cqw; font-weight: 700; letter-spacing: .04em; }
.cover .tag.mine { background: var(--accent); color: var(--accent-ink); }

/* ---------- tab bar ---------- */
.tabs { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--bg); padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 6px 4px; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-block: 6px; color: var(--muted); font-size: 11px; font-weight: 500; }
.tabs button[aria-current="page"] { color: var(--fg); }
.tabs button[aria-current="page"] svg { color: var(--accent); }

/* ---------- sheets / overlays ---------- */
.scrim { position: absolute; inset: 0; background: #05040acc; z-index: 40; display: flex; align-items: flex-end; animation: fade .18s ease; }
.sheet { width: 100%; max-height: 92%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); padding-block: 10px 22px; animation: up .22s ease; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.detail-top { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: end; }
.detail-top h2 { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 11px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 500; letter-spacing: .03em; }
.detail p { color: #d9d4ea; margin: 14px 0 0; max-width: 62ch; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 700; margin: 20px 0 8px; }
.role { padding: 12px 14px; border-radius: 14px; background: #ff7aa812; border: 1px solid #ff7aa833; color: var(--fg); font-size: 14px; }
.cast { display: flex; flex-direction: column; gap: 8px; }
.cast div { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14px; }
.cast .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 15px; background: var(--surface-2); color: var(--accent); }
.cast b { display: block; font-weight: 700; }
.cast span { color: var(--muted); font-size: 13px; }
.actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.actions .btn { flex: 1; min-width: 130px; }

.searchbox { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--surface-2); }
.searchbox input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; }
.results { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
.row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 14px; text-align: left; width: 100%; }
.row:hover { background: var(--surface-2); }
.row .cover { border-radius: 9px; }
.row b { display: block; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row small { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* ---------- play screen ---------- */
#play { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; background: var(--bg); }
#play[hidden] { display: none !important; }
.playbar { flex: none; display: grid; grid-template-columns: 78px minmax(0, 1fr) 78px; align-items: center; gap: 8px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.playbar .t { text-align: center; min-width: 0; }
.playbar .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.playbar .t small { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.status { flex: none; margin: 10px var(--gutter-r) 0 var(--gutter-l); border: 1px solid #7fe0ff55; background: var(--system-bg); border-radius: 12px; padding: 8px 12px; font-size: 12px; }
.status summary { cursor: pointer; color: var(--system); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; list-style: none; display: flex; justify-content: space-between; }
.status summary::-webkit-details-marker { display: none; }
.status .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px 12px; margin-top: 6px; font-variant-numeric: tabular-nums; }
.status .stats div { display: flex; justify-content: space-between; gap: 6px; border-bottom: 1px dashed #7fe0ff33; padding-block: 2px; min-width: 0; }
.status .stats span { color: #bfeeff; }
.status .stats b { color: #fff; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.log { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 16px 12px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 100%; min-width: 0; }
.msg.narr { font-size: 16px; line-height: 1.72; color: #ebe7f7; }
.msg.narr p { margin: 0 0 .7em; max-width: 64ch; }
.msg.narr p:last-child { margin-bottom: 0; }
.msg .q { color: #ffd1e1; }
.msg em { color: #cfc8e8; }
.msg.player { align-self: flex-end; max-width: 86%; background: var(--surface-2); border: 1px solid var(--line); padding: 10px 14px; border-radius: 18px 18px 4px 18px; font-size: 15px; }
.msg.player .m { display: block; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 2px; }
.msg.player.direct { border-style: dashed; background: transparent; color: var(--muted); }
.speaker { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.speaker i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--accent); font-style: normal; font-family: var(--display); font-size: 11px; letter-spacing: 0; }
.thinking { display: inline-flex; gap: 5px; padding: 6px 0; }
.thinking span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
.thinking span:nth-child(2) { animation-delay: .15s; } .thinking span:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.err { font-size: 13px; color: #ffb4b4; background: #ff6b6b14; border: 1px solid #ff6b6b40; padding: 10px 12px; border-radius: 12px; }
.choices { flex: none; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px 8px; }
.choices::-webkit-scrollbar { display: none; }
.choices button { flex: none; max-width: 78%; text-align: left; font-size: 13px; padding: 8px 12px; border-radius: 14px; border: 1px solid #ff7aa855; color: #ffd1e1; background: #ff7aa80d; line-height: 1.3; }
.composer { flex: none; border-top: 1px solid var(--line); padding-block: 8px 10px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.comp-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.quick { display: flex; gap: 4px; }
.quick button { height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.quick button:hover:not(:disabled) { color: var(--fg); background: var(--surface); }
.quick button:disabled { opacity: .35; cursor: default; }
.inputrow { display: flex; gap: 8px; align-items: flex-end; }
.inputrow textarea { flex: 1; min-width: 0; resize: none; max-height: 130px; min-height: 46px; padding: 12px 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--surface); outline: none; font-size: 16px; line-height: 1.35; }
.inputrow textarea:focus { border-color: #ff7aa877; }
.send { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.send:disabled { opacity: .4; cursor: default; }
.send.stop { background: var(--surface-2); color: var(--fg); }

.menu { position: absolute; right: var(--gutter-r); top: 52px; z-index: 35; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px; min-width: 200px; box-shadow: 0 12px 30px #0008; }
.menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.menu button:hover { background: var(--surface); }
.menu button.danger { color: var(--danger); }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: 13px; font-weight: 700; color: #d9d4ea; }
.field .hint { font-size: 12px; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); outline: none; font-size: 16px; }
.field textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.field input:focus, .field textarea:focus { border-color: #ff7aa877; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.pagehead { padding-block: 18px 4px; }
.pagehead h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; }
.pagehead p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.empty { text-align: center; color: var(--muted); padding: 40px 20px; border: 1px dashed var(--line); border-radius: 18px; font-size: 14px; }
.empty b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 4px; }
.statrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.statrow div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.statrow b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.statrow span { color: var(--muted); font-size: 12px; }
.toast { position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; z-index: 60; animation: fade .2s ease; max-width: calc(100% - 32px); text-align: center; }
.linkish { color: var(--accent); font-weight: 700; font-size: 13px; }

/* ---------- audiobook + auto ---------- */
.sysbox { margin: 0 0 .8em; padding: 10px 12px; border: 1px solid #7fe0ff66; background: var(--system-bg); border-radius: 10px; color: #dff6ff; font-size: 14.5px; line-height: 1.55; max-width: 64ch; }
.sysbox .sl { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--system); font-weight: 700; margin-bottom: 3px; }
.sg { border-radius: 4px; transition: background .2s, box-shadow .2s; }
.sg.reading { background: #ff7aa82e; box-shadow: 0 0 0 2px #ff7aa82e; }
.sysbox .sg.reading { background: #7fe0ff33; box-shadow: 0 0 0 2px #7fe0ff33; }
.replay { margin-left: auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.replay:hover, .replay.on { color: var(--accent); background: var(--surface); }
.pb-right { display: flex; gap: 2px; }
.iconbtn.on { color: var(--accent); background: #ff7aa81a; }
.autobar { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.autobar[hidden] { display: none !important; }
.autobar .ab-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 1.4s infinite; flex: none; }
.autobar .ab-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; font-variant-numeric: tabular-nums; }
.autobar .ab-btns { display: flex; gap: 4px; flex: none; }
.autobar .ab-btns button { height: 30px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--surface-2); }
.autobar .ab-btns .stopb { color: var(--danger); }
.quick button.on { color: var(--accent); background: #ff7aa81a; }
.vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; padding-block: 12px; border-bottom: 1px solid var(--line); align-items: center; }
.vrow b { font-size: 15px; display: block; }
.vrow small { color: var(--muted); display: block; font-size: 12px; }
.vrow .vsel { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.vrow select { flex: 1; min-width: 100px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.sheet h2.st { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 6px; }
.sheet p.sp { margin: 0; color: var(--muted); max-width: 52ch; }
.danger-text { color: var(--danger); }
</style>

  <main class="view" id="view"></main>

{
  id: "godsystem", title: "Heavenly Dao System: I Am This World's God", kanji: "神", c1: "#0f5132", c2: "#facc15", isNew: true,
  genres: ["Cultivation", "Fantasy", "Action"],
  tagline: "The heavens answer to you. They just don't know it yet.",
  synopsis: "In the Azure Cloud Sect, Bai Lian is the outer disciple everyone laughs at: shattered meridians, zero cultivation, three years stuck at the bottom. On the day he is to be crippled and thrown out, a voice wakes inside his soul. The Heavenly Dao System has found its host. Bai Lian is not a failed cultivator. He is the sealed god of this world, and every prayer, vow and moment of awe aimed at him now feeds his returning divinity.",
  role: "You are Bai Lian, 17, an outer disciple of the Azure Cloud Sect with shattered meridians. You are secretly the reincarnated, sealed god of this world, and only the System knows.",
  world: "A classic cultivation world of sects, spirit stones, alchemy, arrogant young masters and heavenly tribulations. Realms: Qi Condensation, Foundation Establishment, Core Formation, Nascent Soul, Soul Transformation, Void Ascension, Immortal. The System turns Faith (awe, gratitude or worship aimed at the player) into Divine Points, spent on Divine Authorities: stopping time briefly, divine sight, granting cultivation to others, rewriting one small law of heaven, smiting. Using divinity too openly draws the Nine Heavenly Courts who sealed the player ten thousand years ago. Tone: satisfying power fantasy with clever reveals, humor from people underestimating the player, and stakes that keep climbing.",
  cast: [["Lingxi", "The System's spirit: a hand-sized girl in jade robes only you can see. Formal, smug, fiercely loyal."], ["Su Qinghe", "Inner-sect prodigy, the only disciple ever kind to you. She hides a poison eating her meridians."], ["Feng Yao", "Arrogant young master, grandson of the Grand Elder, who has bullied you for three years."], ["Elder Mu", "The gruff outer-sect elder who senses something impossible about you."]],
  opening: `The stone of the Trial Platform is cold against your cheek. There is blood in your mouth, and laughter all around you.

{Feng Yao}"Three years," Young Master Feng Yao says, pressing his boot into your back. His robes shimmer with Foundation Establishment qi. {Feng Yao}"Three years of eating the sect's rice with meridians like broken reeds. Today the sect takes out its trash." He raises his palm. Qi gathers there, bright and cruel. {Feng Yao}"I'll make it quick. Out of mercy."

At the edge of the crowd, a girl in white inner-sect robes steps forward. {Su Qinghe}"Feng Yao, that's enough!" Su Qinghe. The only person here who ever bothered to learn your name.

Then the world stops.

Falling leaves hang in the air. Feng Yao's palm freezes an inch above your skull. A sound like ten thousand temple bells rings inside your soul.

[SYSTEM] Heavenly Dao System awakened. Host identity confirmed: Primordial God of the Mortal Realm (sealed). Divinity: 0.1%. Faith received: 1 (Su Qinghe, concern). Divine Points: 1.

A tiny girl in jade robes, no taller than your hand, appears on your shoulder and bows so deeply her sleeves brush the stone. {Lingxi}"Forgive my lateness, Your Divinity. Ten thousand years is a long time to sleep." She glances at Feng Yao's frozen palm and sniffs. {Lingxi}"Shall we begin?"`,
  choices: ["Ask Lingxi what 1 Divine Point can do", "\"Begin.\" Let time resume and face Feng Yao", "Look at Su Qinghe with divine sight"],
  status: "Realm: Mortal (sealed god) | Divinity: 0.1% | Faith: 1 | Divine Points: 1 | Authority: Time Stop | Exposure: Low"
},
{
  id: "archive", title: "Reborn with the Archive Skill", kanji: "転", c1: "#2b4fd8", c2: "#ff9b54",
  genres: ["Isekai", "Fantasy", "Action"],
  tagline: "Copy any spell you see. Once.",
  synopsis: "A delivery truck, a flash of white, and you wake up as Ren Albright, the forgotten fourth son of a broke frontier baron. The goddess of records gave you one unique skill: Archive. Watch any spell once and you can cast it forever, but every copy costs you a memory from your past life.",
  role: "You are Ren Albright, 15, fourth son of Baron Albright of the Ashmark frontier. Your family thinks you are skill-less. You remember your past life as an office worker in Tokyo.",
  world: "Sword-and-sorcery kingdom of Valdren. Magic is ranked from Spark to Sovereign. The frontier is poor and beset by monsters from the Thornwood. Tone: hopeful power-fantasy with real costs and warm found family.",
  cast: [["Lisette Albright", "Your sharp-tongued older sister, a knight-in-training who secretly worries about you."], ["Grandmaster Oswin", "A disgraced court mage hiding out as the village drunk."], ["Mira", "A half-elf hunter girl who owes no one anything and says so."]],
  opening: `The ceiling above you is made of cracked oak beams, not office tiles. For a long moment you just breathe.

Then the window appears, pale blue and humming, floating a hand's width from your face.

[SYSTEM] Reincarnation complete. Unique Skill granted: ARCHIVE (Lv 1). Witness a spell once to record it. Warning: each record consumes one past-life memory.

Footsteps thunder in the hallway. The door bangs open and a girl in a dented practice breastplate glares at you. "Ren! You've been asleep for three days. Father's selling the north field to pay the tax collector, and a goblin pack hit the mill last night." Lisette's voice cracks on the last word. "Can you even stand?"

Outside, someone screams. Through the window you see smoke rising from the mill, and a hunched figure in a stained robe stumbling toward it, fire already curling around his fingers.`,
  choices: ["Run to the mill to watch the old man's spell", "Ask Lisette what happened while you slept", "Open the system window and study Archive"],
  status: "Lv: 1 | HP: 40/40 | MP: 12/12 | Skill: Archive Lv1 | Spells: none | Memories: 99"
},
{
  id: "moonveil", title: "Moonveil Academy", kanji: "魔", c1: "#5b2bb5", c2: "#59d6ff",
  genres: ["Fantasy", "School", "Action"],
  tagline: "No affinity. No rank. No chance?",
  synopsis: "Every student at Moonveil Academy has a magical affinity stamped on their crest. Yours came back blank. Now the transfer student nobody can classify has to survive the Crescent Trials, a ranked dueling tournament that decides who stays and who is expelled.",
  role: "You are a first-year transfer student with an unreadable affinity crest. Something answers when you are in danger, but you do not know what.",
  world: "A floating academy above a silver sea. Houses: Ember, Tide, Gale, Stone. Rankings are public and brutal. Tone: shonen tournament energy with school-life warmth and a mystery about your crest.",
  cast: [["Seraphine Valois", "Top-ranked Ember first-year, cold, proud, and annoyed that you exist."], ["Toma Kirishima", "Your cheerful Gale roommate who talks too much and notices everything."], ["Professor Lumi", "Your sleepy, unreadable homeroom teacher who seems to know what your crest means."]],
  opening: `The crest on your blazer is supposed to glow. Everyone else's does: red for Ember, blue for Tide, green for Gale, amber for Stone. Yours sits there, a dull silver circle, while three hundred first-years in the Great Hall turn to stare.

"Unclassified," announces the headmaster's floating quill, and writes it on the rankings board in letters as tall as you are. Rank 300 of 300.

Someone laughs. Then a voice cuts through it, clear as a bell. "Then it's a waste of a seat." A girl with flame-red hair stands at the front, her Ember crest blazing. Seraphine Valois, rank 1. "Headmaster, I formally challenge the transfer student to a placement duel. Today."

The hall erupts. Beside you, your new roommate Toma whispers, "Okay. So. That's bad. That's really bad."

From the teachers' table, Professor Lumi opens one eye and looks straight at you, like she is waiting to see what you'll do.`,
  choices: ["Accept the duel in front of everyone", "Refuse calmly and ask why she cares", "Look to Professor Lumi for a sign"],
  status: "Rank: 300/300 | HP: 50/50 | Mana: ??? | Affinity: Unclassified | Points: 0"
},
{
  id: "roommate", title: "My Roommate Is the Campus Idol", kanji: "恋", c1: "#d94a7b", c2: "#ffd36e",
  genres: ["Romance", "Slice of Life", "Comedy"],
  tagline: "A housing mix-up. One apartment. Her secret.",
  synopsis: "A clerical error at the university housing office puts you in the same two-bedroom apartment as Hinata Sakuraba, the reserved, impossibly popular student everyone on campus talks about. The contract is locked until spring. Then you find her drawings.",
  role: "You are a second-year university student who just moved to the city with one suitcase and very little money.",
  world: "Modern Tokyo suburb, cherry blossom season, a cramped apartment above a family bakery. Tone: warm, funny, slow-burn rom-com. No one is cruel; misunderstandings are gentle.",
  cast: [["Hinata Sakuraba", "Calm and polite in public, secretly drawing a shonen manga at 3 a.m. under a pen name."], ["Daichi Mori", "Your loud best friend who thinks this is the greatest thing that has ever happened."], ["Mrs. Okabe", "The baker landlady downstairs who feeds you both and ships you openly."]],
  opening: `The key fits. That's the first surprise. The second is the pair of white sneakers already lined up neatly in the entryway.

"Excuse me," says a quiet voice. You look up. Standing in the hallway with a mug of tea is Hinata Sakuraba, the girl whose face is on the campus festival poster, the one whose name you've heard in every lecture hall since April. She looks at your suitcase. Then at you. Then at the letter in your hand with the same room number as hers.

"I think," she says carefully, "the housing office made a mistake."

Downstairs, the bakery bell jingles, and Mrs. Okabe's voice floats up the stairwell. "Hinata-chan! Is your new roommate here? I made melon bread for two!"

Hinata's ears turn pink. Behind her, through the half-open door of her room, you catch a glimpse of a desk buried in inked manga pages, and a single sheet that has fallen onto the floor.`,
  choices: ["Offer to sleep at a friend's until it's sorted", "Pick up the fallen manga page", "Say hi and ask about the melon bread"],
  status: null
},
{
  id: "shadow", title: "The Shadow That Walks Behind Me", kanji: "影", c1: "#1b1d2e", c2: "#9a6bff",
  genres: ["Action", "Urban Fantasy", "Mystery"],
  tagline: "Your shadow moves on its own. It wants a contract.",
  synopsis: "Ten years after rifts tore open the sky over Neo-Kyoto, hunters with awakened powers keep the city running. You failed your awakening test. Then, during a rift break in your neighborhood, your shadow stood up, looked at you, and asked if you wanted to live.",
  role: "You are a 19-year-old convenience store clerk in Neo-Kyoto who was rated 'dormant' at your awakening test.",
  world: "Near-future Kyoto of neon shrines, maglev trains, and sealed rift zones. Hunter guilds are celebrities. Tone: stylish urban action with eerie folklore and a slow-reveal mystery about the shadow, Kuro.",
  cast: [["Kuro", "Your shadow, a polite, ancient, and slightly menacing spirit who refuses to say what it was before."], ["Captain Aya Tsukishiro", "A-rank hunter who arrives after the break and is very interested in you."], ["Jun", "Your coworker and only friend, a gamer who knows way too much hunter trivia."]],
  opening: `At 2:14 a.m. the sky over Shimogyo splits like wet paper.

You are restocking onigiri when the store's windows turn violet. Sirens. The PA crackles: rift break, Grade C, evacuate to the nearest shelter. Jun is already sprinting for the back door. "Come ON!"

You make it three steps before something with too many joints climbs through the shattered glass. It turns its eyeless head toward you.

The lights die.

In the red glow of the emergency sign, your shadow peels itself off the floor. It stands. It is exactly your height, and it is looking at you with two thin white slits where eyes should be.

"Good evening," it says, in a voice like a temple bell heard underwater. "I am called Kuro. I can kill that for you. I would like something small in return." It tilts its head. "Do you wish to live?"

The creature lunges.`,
  choices: ["\"Yes. Do it.\"", "\"What do you want in return?\"", "Grab the fire extinguisher and fight"],
  status: "Rank: Dormant | HP: 30/30 | Shadow Sync: 0% | Contract: none | Guild: none"
},
{
  id: "villainess", title: "The Villainess Just Wants to Bake", kanji: "薔", c1: "#8a1f3d", c2: "#ffb3c7",
  genres: ["Isekai", "Romance", "Comedy"],
  tagline: "30 days until her doom. She'd rather open a bakery.",
  synopsis: "You wake up as Lady Celestine Vaire, the villainess of a romance game you once played. In 30 days, at the royal ball, the crown prince will denounce you and you will be exiled. Your plan: skip the drama, avoid every love interest, and open a small bakery. The love interests have other plans.",
  role: "You are Lady Celestine Vaire, 17, daughter of a powerful duke, infamous for your temper. You remember the game's plot, and you know how to bake.",
  world: "A pastel royal court full of gossip, ballrooms, and enchanted roses. Tone: light, witty court comedy. Characters who were 'scripted' slowly start acting outside the game's script because of you.",
  cast: [["Prince Adrien", "The crown prince who is supposed to hate you and is confused that you keep avoiding him."], ["Elodie Marchant", "The game's sweet heroine, who wants to be your friend at all costs."], ["Bastien", "Your stone-faced butler who has secretly kept you alive for years."]],
  opening: `You are holding a teacup. It is very expensive. You know this because the maid in front of you is trembling as if you're about to throw it at her.

You do not throw it. Instead you stare at your reflection in the tea: silver-blonde ringlets, violet eyes, a face that was the final boss of a romance game you played on a long train ride years ago. Lady Celestine Vaire. The villainess. Exiled at the royal ball in thirty days.

"My lady?" says a calm voice. Your butler, Bastien, stands by the door with an envelope sealed in royal gold. "The crown prince requests your presence at tomorrow's garden tea. He also asks that you, and I quote, 'refrain from setting anything on fire this time.'"

The maid flinches. You set the teacup down very gently.

Through the window, beyond the rose garden, you can see the town below. On the corner of the market square sits an empty shop with a faded sign: FOR LEASE. It used to be a bakery.`,
  choices: ["Apologize to the trembling maid", "Ask Bastien how to decline a prince", "Sneak into town to see the empty bakery"],
  status: "Days until ball: 30 | Reputation: Feared | Prince affection: -20 | Bakery fund: 0 gold"
},
{
  id: "dragon", title: "Dragonbound Courier", kanji: "竜", c1: "#c2410c", c2: "#ffd166",
  genres: ["Fantasy", "Adventure"],
  tagline: "Every letter gets delivered. Even through a storm.",
  synopsis: "In the Skyreach Archipelago, islands float above an endless cloud sea and the only reliable mail is carried by courier riders and their dragons. You just inherited a route, a battered saddle, and Ember, a young dragon with a big attitude who did not ask for a new rider.",
  role: "You are a rookie courier with the Windward Post, on your first day riding a dragon who has not decided whether to like you.",
  world: "Floating islands, airship pirates, sky lighthouses, and storms with names. Each letter carries a small human story. Tone: Ghibli-esque adventure, cozy but with real danger in the sky.",
  cast: [["Ember", "A copper-scaled young dragon, sarcastic, proud, terrified of thunder (do not mention it)."], ["Postmistress Gale", "Your one-armed boss, a legendary former rider who believes in you more than you do."], ["Captain Rook", "A charming sky pirate who keeps 'accidentally' crossing your route."]],
  opening: `The wind on the launch platform tastes like salt and cold iron. Below the edge, there is nothing but clouds for a mile, white and endless.

"That's her," says Postmistress Gale, pointing with her one good arm. "Ember. Your partner."

The copper dragon on the perch is about the size of a carriage. She opens one gold eye, looks at you, and very deliberately yawns, showing every tooth.

"She bit her last rider," Gale adds. "Only a little. Here's your satchel." It is heavy: three letters, one small wrapped box, and an envelope sealed in black wax marked URGENT. ISLE OF VESPER. BEFORE NIGHTFALL.

On the horizon, a wall of purple cloud is rolling in. The storm-watch bell starts ringing.

Ember's eye flicks to the storm. Her tail wraps tighter around the perch. For just a second, the proud dragon looks small.`,
  choices: ["Offer Ember the jerky from your pocket", "Read the address on the small box", "Ask Gale about the black-wax letter"],
  status: "Ember trust: 5/100 | Stamina: 100% | Letters: 5 | Time to nightfall: 6h"
},
{
  id: "shrine", title: "Part-Time at the Fox Shrine", kanji: "狐", c1: "#b45309", c2: "#fde68a",
  genres: ["Slice of Life", "Supernatural", "Comedy"],
  tagline: "The job listing said 'light cleaning.' It lied.",
  synopsis: "You took a part-time job at a tiny mountain shrine for the free rent. Your boss turns out to be Kohaku, a nine-hundred-year-old fox spirit with expensive taste in tofu and a backlog of wishes from local spirits that nobody has answered in decades.",
  role: "You are a college dropout who answered a shrine's job ad because you needed somewhere to live. You can see spirits now, which is new.",
  world: "A sleepy mountain town in rural Japan where yokai live quietly beside humans. Each episode a spirit brings a small problem. Tone: cozy, funny, gently bittersweet.",
  cast: [["Kohaku", "A golden fox spirit in human form, vain, lazy, secretly very lonely."], ["Ushio", "A tiny river kappa who runs the town's gossip network."], ["Grandma Fuji", "The town's sharp-eyed shopkeeper, who has seen spirits all her life."]],
  opening: `The shrine is smaller than the photo in the listing. Three hundred stone steps, one wooden hall with a sagging roof, and a donation box with a sticky note: OUT OF ORDER.

You ring the bell. Nothing happens. You ring it again.

"Must you?" A young man with long gold hair is lying on the hall's veranda, one arm over his eyes. He wears an old silk kimono, and from beneath it, curling lazily across the floorboards, are nine golden tails. "You're the new part-timer. Good. Your first task is to bring me fried tofu. Your second task," he lifts his arm and squints at you with amber eyes, "is to deal with that."

He points. Behind you, at the bottom of the shrine steps, a line has formed. A paper umbrella with one eye. A crying stone statue. A tiny green creature holding a cucumber like a petition. At least twenty spirits, waiting.

"Wishes," says Kohaku, and goes back to sleep. "I've been putting them off."`,
  choices: ["Go buy fried tofu first", "Talk to the first spirit in line", "Ask Kohaku why he stopped granting wishes"],
  status: "Shrine faith: 3 | Wishes granted: 0/24 | Kohaku's mood: Sleepy | Yen: 1,200"
},
{
  id: "yomi", title: "Last Train at 4:44", kanji: "夜", c1: "#0f2a2e", c2: "#4ade80",
  genres: ["Mystery", "Horror"],
  tagline: "This station isn't on any map.",
  synopsis: "You fall asleep on the last train home and wake at 4:44 a.m. on a train that should not exist, rolling through endless dark toward a station called Kisaragi-Ura. The other passengers each have a reason they can't remember. One of them is lying.",
  role: "You are a tired office worker who fell asleep on the last train home. You have a dead phone, one train ticket, and no memory of boarding this car.",
  world: "An eerie liminal train between the living world and somewhere else. Rules exist and breaking them has consequences. Tone: slow-burn psychological mystery and urban legend horror, unsettling but never gory.",
  cast: [["The Conductor", "Polite, faceless beneath his cap, and strict about the rules."], ["Saki", "A high-school girl in a winter uniform in the middle of summer."], ["Mr. Hayashi", "A friendly salaryman who has ridden this train 'for a while now.'"]],
  opening: `The train sways. You jolt awake with your cheek against cold glass.

The clock above the door reads 4:44. Outside the window there is no city, no lights, just a dark that seems to go on forever, and once in a while a single red paper lantern hanging from nothing.

The car is almost empty. A girl in a winter school uniform sits across from you, staring at her shoes. Further down, a salaryman is reading a newspaper dated eleven years ago. He catches you looking and smiles. "First time? Don't worry. It's fine as long as you follow the rules."

The connecting door slides open. A conductor in a navy uniform steps through. Under his cap, where a face should be, there is only shadow.

"Tickets, please," he says. "Next stop, Kisaragi-Ura. Passengers are reminded: do not look back when you exit. Do not answer if someone calls your name."

Your phone, dead a moment ago, buzzes once. One new message, from a number you don't know: DON'T GET OFF.`,
  choices: ["Hand over your ticket and stay quiet", "Ask the salaryman what the rules are", "Quietly show the message to the girl"],
  status: "Sanity: 100% | Time: 4:44 | Rules known: 2 | Clues: 1"
},
{
  id: "mecha", title: "Unit Zero", kanji: "鋼", c1: "#334155", c2: "#38bdf8",
  genres: ["Sci-Fi", "Action"],
  tagline: "The mech nobody could pilot just chose you.",
  synopsis: "Colony Ship Aster is under siege by the Hollow, a silent alien swarm. The defense academy's most advanced mech, Unit Zero, has rejected every pilot for twelve years. During an attack, you, a maintenance cadet, are the one standing closest when its cockpit opens.",
  role: "You are a 17-year-old maintenance cadet on Colony Ship Aster. You know every bolt of Unit Zero. You have never piloted anything.",
  world: "A generation ship with forests and cities inside its hull. Pilots sync neurally with their mechs; high sync gives power but blurs your memories with the machine's. Tone: earnest mecha drama, big battles, bigger feelings.",
  cast: [["ZERO", "Unit Zero's AI, curt, curious, and learning what humans are by watching you."], ["Lt. Kaede Arisawa", "Ace pilot who resents that a cadet got 'her' mech."], ["Dr. Imre Voss", "Chief engineer, your mentor, hiding what Unit Zero really is."]],
  opening: `The hangar alarms are screaming red when the Hollow breach the outer hull.

You are under Unit Zero's left knee with a torque wrench when the whole bay shakes. Pilots sprint for their mechs. Lieutenant Arisawa's Unit Seven roars out of its cradle and through the launch gate. Then the gate explodes.

Something pale and many-limbed drifts through the smoke, silent as falling snow.

Above you, metal groans. Unit Zero, the mech that has rejected every pilot for twelve years, the one nobody has seen move since you were five, turns its head. Its visor lights up a cold blue. Steam hisses as the chest hatch unseals and swings open, right in front of you.

A voice speaks inside your skull, flat and clear.

<ZERO> Pilot candidate detected. Sync compatibility: 94 percent. Hostile approaching. Decision required.

The Hollow turns toward the sound.`,
  choices: ["Climb into the cockpit", "Shout for Dr. Voss", "\"Why me?\" you ask ZERO"],
  status: "Sync: 0% | Armor: 100% | Energy: 100% | Hollow nearby: 1 | Memory bleed: 0"
},
{

  (run.extra || []).forEach(n => { if (!list.includes(n)) list.push(n); });
  return list;
}
function descFor(run, sp) {
  const s = findSource(run.kind, run.ref);
  if (run.kind === "char") return sp === s.name ? s.persona : "";
  return ((s.cast || []).find(c => c[0] === sp) || [])[1] || "";
}
function guessGender(d) {
  const f = (d.match(/\b(she|her|hers|girl|woman|sister|lady|princess|queen|daughter|mother|grandma|heroine|postmistress|idol)\b/gi) || []).length;
  const m = (d.match(/\b(he|his|him|boy|man|brother|lord|prince|king|son|father|grandson|master|sir|salaryman)\b/gi) || []).length;
  return f > m ? "f" : m > f ? "m" : "";
}
function defaultVoice(run, sp) {
  const list = speakersFor(run);
  let j = list.indexOf(sp); if (j < 0) j = 4 + (hashStr(sp) % 7);
  const dv = deviceVoices(); const uri = v => (v && v.voiceURI) || "";
  if (sp === "Narrator") return { cv: "buttery", dv: uri(dv[0]), rate: 1, pitch: 1 };
  if (sp === "System") return { cv: "glassy", dv: uri(dv[2] || dv[1] || dv[0]), rate: 0.95, pitch: 0.75 };
  const k = Math.max(0, j - 1), g = guessGender(descFor(run, sp));
  let pool = g === "f" ? dv.filter(v => FEMALE_V.test(v.name)) : g === "m" ? dv.filter(v => MALE_V.test(v.name)) : [];
  if (pool.length > 1) pool = pool.filter(v => v !== dv[0]); // keep the narrator's voice for the narrator
  const others = dv.length > 1 ? dv.slice(1) : dv;
  const pick = pool.length ? pool[k % pool.length] : others[k % Math.max(1, others.length)];
  return {
    cv: ["airy", "rounded", "glassy"][k % 3], dv: uri(pick),
    rate: [1, 0.93, 1.08][Math.floor(k / 3) % 3],
    pitch: g === "f" ? 1.2 + (k % 2) * 0.12 : g === "m" ? 0.82 - (k % 2) * 0.08 : 1.05 + (k % 3) * 0.08
  };
}
function voiceCfg(run, sp) { return Object.assign({}, defaultVoice(run, sp), (run.voices || {})[sp] || {}); }

/* =========================================================
   Helpers
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmt(text) {
  const paras = String(text || "").trim().split(/\n{2,}/);
  return paras.map(p => {
    let h = esc(p);
    h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.replace(/\*(.+?)\*/g, "<em>$1</em>");
    h = h.replace(/&quot;(.+?)&quot;/g, '<span class="q">“$1”</span>');
    h = h.replace(/“([^”]+)”/g, '<span class="q">“$1”</span>');
    h = h.replace(/\n/g, "<br>");
    return "<p>" + h + "</p>";
  }).join("");
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  if (s < 60) return "now"; if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h"; return Math.floor(s / 86400) + "d";
}
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; $("#app").append(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2200);
}
function coverHTML(src, opts = {}) {
  const c1 = src.c1, c2 = src.c2;
  const title = src.title || src.name;
  return `<div class="cover" style="--c1:${esc(c1)};--c2:${esc(c2)}">
    <div class="kj" aria-hidden="true">${esc(src.kanji)}</div>
    <div class="shade"></div>
    ${opts.rank ? `<div class="rank">${opts.rank}</div>` : ""}
    ${opts.tag ? `<div class="tag ${opts.tagClass || ""}">${esc(opts.tag)}</div>` : ""}
    ${opts.noTitle ? "" : `<div class="ct">${esc(title)}</div>`}
  </div>`;
}
function findSource(kind, id) {
  if (kind === "story") return STORIES.find(s => s.id === id);
  if (kind === "char") return CHARACTERS.find(c => c.id === id);
  if (kind === "custom") return customs.find(c => c.id === id);
}
const runKey = (kind, id) => kind + ":" + id;

}
function closeSheet() { $("#scrim")?.remove(); }

/* ---------- search ---------- */
function openSearch() {
  const all = [
    ...STORIES.map(s => ({ kind: "story", s, text: (s.title + " " + s.genres.join(" ") + " " + s.tagline).toLowerCase(), sub: s.genres.join(" · ") })),
    ...CHARACTERS.map(c => ({ kind: "char", s: c, text: (c.name + " " + c.title).toLowerCase(), sub: c.title })),
    ...customs.map(c => ({ kind: "custom", s: c, text: (c.title + " " + c.genres.join(" ")).toLowerCase(), sub: "Your title" }))
  ];
  openSheet(`
    <div class="searchbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="Search stories, genres, characters" autocomplete="off" aria-label="Search"></div>
    <div class="results" id="results"></div>`, sc => {
    const q = sc.querySelector("#q"), out = sc.querySelector("#results");
    const draw = () => {
      const t = q.value.trim().toLowerCase();
      const hits = all.filter(x => !t || x.text.includes(t)).slice(0, 30);
      out.innerHTML = hits.length ? hits.map(x => `<button class="row" data-k="${x.kind}" data-id="${esc(x.s.id)}">${coverHTML(x.s, { noTitle: true })}<span style="min-width:0"><b>${esc(x.s.title || x.s.name)}</b><small>${esc(x.sub)}</small></span><span class="meta">${x.kind === "char" ? "Chat" : "Story"}</span></button>`).join("")
        : `<div class="empty"><b>No matches</b>Try a genre like “romance” or “isekai”.</div>`;
      out.querySelectorAll(".row").forEach(r => r.onclick = () => openDetail(r.dataset.k, r.dataset.id));
    };
    q.addEventListener("input", draw); draw(); setTimeout(() => q.focus(), 50);
  });
}

        ` Reply with only JSON: {"title": string (max 6 words), "premise": string (2-3 sentences with a hook and stakes), "role": string (1 sentence, starts with "You are"), "world": string (1-2 sentences: setting and tone), "cast": [{"name": string, "desc": string (under 15 words)}] (exactly 3)}`,
        { modelTier: "quick", cache: false });
